<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAutomoveis | Sistema de Gerenciamento</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <!-- Google Font -->
    
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
      body {
          font-family: 'Roboto', sans-serif;
          background: linear-gradient(135deg, #f8f9fa, #e9ecef);
          margin: 0;
          padding: 0;
      }
      /* Navbar */
      .navbar {
          background: #343a40;
      }
      .navbar-brand {
          font-weight: bold;
          font-size: 2rem;
          color: #fff;
      }
      .navbar-brand:hover {
          color: #fff;
      }
      .nav-item .nav-link {
          margin-left: 10px;
          font-size: 1.1rem;
      }
      
      /* Transforma os links do menu em botões */
      .nav-item .btn-nav {
          border: 1px solid #ffc107;
          border-radius: 5px;
          color: #ffc107;
          padding: 5px 12px;
          text-decoration: none;
          transition: background 0.3s, color 0.3s;
      }
      .nav-item .btn-nav:hover {
          background: #ffc107;
          color: #343a40;
      }
      
      /* Hero Section */
      .hero-section {
          height: calc(100vh - 56px);
          background: url('https://images.unsplash.com/photo-1517414204280-0c8b60a58509?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80') no-repeat center center/cover;
          position: relative;
          color: #fff;
      }
      .hero-overlay {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%; 
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
      }
      .hero-content {
          position: relative;
          z-index: 2;
          top: 50%;
          transform: translateY(-50%);
          text-align: center;
      }
      .hero-content h1 {
          font-size: 3.5rem;
          font-weight: bold;
          letter-spacing: 2px;
          text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      }
      .hero-content p {
          font-size: 1.5rem;
          margin-top: 20px;
          text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
      }
      /* Footer */
      footer {
          background: #A9A9A9;
          color: #fff;
          padding: 20px 0;
          text-align: center;
      }
    </style>
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md">
        <div class="container">
            <!-- Exibe o título como um simples texto -->
            <span class="navbar-brand">SuperAutomoveis</span>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link btn-nav" href="cadastrarVeiculo.jsp">Cadastrar Automóvel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn-nav" href="ListarVeiculoServlet">Listar Automóveis</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn-nav" href="pesquisaVeiculo.jsp">Pesquisar Veículo</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section sem botão de ação -->
    <header class="hero-section">
      <div class="hero-overlay"></div>
      <div class="container hero-content">
          <h1>Bem-vindo ao Sistema SuperAutomoveis!</h1>
          <p>Gerencie seus automóveis de forma moderna, prática e eficiente.</p>
      </div>
    </header>

    <!-- Footer -->
    <footer>
       <div class="container">
           <p>&copy; 2025 SuperAutomoveis. Todos os direitos reservados by Ali.</p>
       </div>
    </footer>

    <!-- Bootstrap JS e dependências -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</body>
</html>
